name: eventify

services:
  api:
    build: .
    image: eventify:local
    command: ["node", "dist/server.js"]
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://eventify:eventify@db:5432/eventify
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-compose-development-secret}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      ETHEREAL_USER: ${ETHEREAL_USER:-example@ethereal.email}
      ETHEREAL_PASS: ${ETHEREAL_PASS:-example-password}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s

  worker:
    build: .
    image: eventify:local
    command: ["node", "dist/worker.js"]
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://eventify:eventify@db:5432/eventify
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-compose-development-secret}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      ETHEREAL_USER: ${ETHEREAL_USER:-example@ethereal.email}
      ETHEREAL_PASS: ${ETHEREAL_PASS:-example-password}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: eventify
      POSTGRES_PASSWORD: eventify
      POSTGRES_DB: eventify
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventify -d eventify"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
